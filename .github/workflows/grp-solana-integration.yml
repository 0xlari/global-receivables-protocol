name: GRP Solana Integration

on:
  push:
    branches:
      - migration/grp-phase-1
  workflow_dispatch:

jobs:
  solana-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor AVM
        shell: bash
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 1.2.0
          avm use 1.2.0
          anchor --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Create CI wallet and program keypair
        shell: bash
        run: |
          mkdir -p "$HOME/.config/solana" target/deploy
          solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"
          solana-keygen new --no-bip39-passphrase --force -o target/deploy/global_receivables_protocol-keypair.json
          anchor keys sync

      - name: Build Anchor program
        run: anchor build

      - name: Rust tests
        run: cargo test

      - name: Start local validator
        shell: bash
        run: |
          solana-test-validator --reset --quiet > /tmp/solana-validator.log 2>&1 &
          echo $! > /tmp/solana-validator.pid
          for i in {1..30}; do
            if solana cluster-version -u localhost >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/solana-validator.log
          exit 1

      - name: Deploy GRP program
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
        run: |
          solana airdrop 10 -u localhost
          anchor deploy

      - name: Run on-chain integration tests
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
        run: pnpm exec ts-mocha -p ./tsconfig.anchor.json -t 1000000 tests-anchor/**/*.ts

      - name: Show validator log on failure
        if: failure()
        run: cat /tmp/solana-validator.log || true
